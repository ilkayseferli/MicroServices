version: "3.1"

services:
  s_api_gateway:
    container_name: c_api_gateway
    image: ilkayseferli/apigateway
    build:
      context: .
      dockerfile: APIGateway/Dockerfile
    ports:
      - "80:80"
    networks:
      - micro_net
      - int_net

  s_contact_api:
    container_name: c_contact_api
    image: ilkayseferli/contactapi
    build:
      context: .
      dockerfile: Services/ContactAPI/Contact.API/Dockerfile
    ports:
      - "7083:7083"
    networks:
      - int_net

  s_res_api:
    container_name: c_res_api
    image: ilkayseferli/resapi
    build:
      context: .
      dockerfile: Services/ResAPI/Reservation.API/Dockerfile
    ports:
      - "7167:7167"
    networks:
      - int_net

networks:
  int_net:
    driver: bridge
    internal: true
  micro_net:
    driver: bridge